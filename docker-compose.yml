services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: networking-lab-backend
    expose:
      - "5000"
    environment:
      - APP_ENV=development
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: networking-lab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
