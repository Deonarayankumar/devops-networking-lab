services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: networking-lab-backend
    expose:
      - "5000"
    environment:
      - APP_ENV=development
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: networking-lab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
